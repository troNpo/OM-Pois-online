<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Búsqueda de PDI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Cabecera estilo OruxMaps -->
        <div class="orux-top-bar">
            <span>Búsqueda de PDI</span>
        </div>

        <div class="search-params">
            <div id="info-coords" style="font-size: 0.85rem; color: #b0bec5; margin-bottom: 8px;">Max. Lat: --</div>
            
            <label for="search-radius">Radio de búsqueda: <span id="radius-value">20</span> km</label>
            <input type="range" id="search-radius" min="1" max="100" value="20">

            <div style="margin-top: 10px;">
                <label for="max-results" style="font-size: 0.85rem; color: #b0bec5;">Max. resultados (por defecto 3000):</label>
                <input type="number" id="max-results" value="3000" style="width: 100%; padding: 6px; background: #222; color: #fff; border: 1px solid #444; border-radius: 4px; margin-top: 4px;">
            </div>
        </div>

        <!-- Selector de Idioma -->
        <div class="language-selector-container" style="margin: 15px 0; display: flex; align-items: center; justify-content: space-between;">
            <label for="select-lang" style="color: #fff; font-size: 0.9rem;">Idioma / Language:</label>
            <select id="select-lang" style="padding: 6px; background: #333; color: #fff; border: 1px solid #555; border-radius: 4px;">
                <option value="es" selected>Español</option>
                <option value="en">English</option>
                <option value="de">Deutsch</option>
                <option value="fr">Français</option>
                <option value="it">Italiano</option>
                <option value="nl">Nederlands</option>
            </select>
        </div>

        <!-- Cabecera de Categorías con el Interruptor idéntico a la captura -->
        <div class="categories-header-bar">
            <span style="font-weight: bold; color: #fff;">Categorías</span>
            <div style="display: flex; align-items: center; gap: 10px;">
                <span style="font-size: 0.85rem; color: #b0bec5;">Expandir nodos</span>
                <label class="toggle-switch">
                    <input type="checkbox" id="toggle-expand-all">
                    <span class="slider-switch"></span>
                </label>
            </div>
        </div>

        <!-- Contenedor del árbol de categorías -->
        <div id="category-container"></div>

        <button id="btn-search" style="width: 100%; margin-top: 20px; padding: 12px; background: #b71c1c; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">
            Buscar y Generar KML
        </button>
    </div>

    <script src="script.js"></script>
</body>
</html>
