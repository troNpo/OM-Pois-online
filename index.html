<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Búsqueda de PDI - OruxMaps / Cruiser</title>
    
    <!-- MapLibre GL CSS -->
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <!-- MapLibre GL JS -->
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- BARRA SUPERIOR DE ACCIONES -->
    <header class="top-bar">
        <div class="header-title" data-i18n="app_title">POI Exporter</div>
        <div class="header-actions">
            <!-- 1. Ayuda -->
            <button id="btn-help" title="Ayuda"><img src="./ui-icons/help.svg" alt="Ayuda"></button>
            
            <!-- 2. Limpiar selecciones -->
            <button id="btn-clear" title="Limpiar"><img src="./ui-icons/cancel.svg" alt="Limpiar"></button>
            
            <!-- 3. Realizar búsqueda -->
            <button id="btn-search" title="Buscar"><img src="./ui-icons/check.svg" alt="Buscar"></button>
            
            <!-- 4. Selector de idioma con icono -->
            <div class="lang-selector-wrapper">
                <img src="./ui-icons/language.svg" alt="Idioma" class="icon-inline">
                <select id="select-lang">
                    <option value="es">ES</option>
                    <option value="en">EN</option>
                    <option value="de">DE</option>
                    <option value="fr">FR</option>
                    <option value="it">IT</option>
                    <option value="nl">NL</option>
                </select>
            </div>
        </div>
    </header>

    <!-- SECCIÓN DEL MAPA ACORDEÓN (Encima del slider) -->
    <div class="map-accordion-section">
        <button id="btn-toggle-map" class="accordion-header">
            <img src="./ui-icons/map.svg" alt="Mapa" class="icon-inline"> 
            <span data-i18n="map_preview">Vista previa del área</span>
            <span class="accordion-arrow">›</span>
        </button>
        <div id="map-container-collapse" class="accordion-content" style="display: none;">
            <div id="mini-map"></div>
        </div>
    </div>

    <!-- CONTROL DE RADIO Y SUPERFICIE -->
    <div class="radius-control-panel">
        <label><span data-i18n="label_radius">Radio</span>: <span id="radius-value">5</span> km</label>
        <input type="range" id="search-radius" min="1" max="15" value="7.5">
        <div id="info-area">Superficie del área: 78.5 km²</div>
    </div>

    <!-- CABECERA DE CATEGORÍAS CON EDICIÓN -->
    <div class="categories-header-bar">
        <div class="categories-title-group">
            <span data-i18n="label_categories">Categorías</span>
            <!-- Botón de Editar Visibilidad con edit.svg -->
            <button id="btn-edit-mode" title="Editar visibilidad"><img src="./ui-icons/edit.svg" alt="Editar"></button>
        </div>
        
        <!-- Acciones contextuales del modo edición (Ocultas por defecto) -->
        <div class="edit-actions-group" style="display: none;">
            <button id="btn-validate-edit" title="Validar"><img src="./ui-icons/check.svg" alt="Validar"></button>
            <button id="btn-restore-edit" title="Restaurar por defecto"><img src="./ui-icons/reverse.svg" alt="Restaurar"></button>
        </div>

        <div class="expand-group">
            <label class="toggle-switch">
                <input type="checkbox" id="toggle-expand-all">
                <span class="slider-switch"></span>
            </label>
            <span data-i18n="label_expand">Expandir</span>
        </div>
    </div>

    <!-- CONTENEDOR PRINCIPAL DEL ÁRBOL DE CATEGORÍAS -->
    <main id="category-container">
        <!-- Las categorías se cargarán dinámicamente aquí -->
    </main>
    <!-- PANEL DE RESULTADOS -->
<div id="results-panel" class="app-panel" style="display: none;">
    
    <!-- Cabecera Roja (Barra de herramientas) -->
    <header class="app-header red-bar">
        <button id="btn-back" class="icon-btn" title="Volver">
            <img src="./ui-icons/back.svg" alt="Back">
        </button>
        <div class="header-title-group">
            <button id="btn-results-list" class="icon-btn badge-container">
                <img src="./ui-icons/list.svg" alt="Resultados">
                <span id="results-badge" class="badge">0</span>
            </button>
            <button id="btn-toggle-search" class="icon-btn" title="Buscar en lista">
                <img src="./ui-icons/search.svg" alt="Buscar">
            </button>
            <button id="btn-select-all" class="icon-btn" title="Marcar/Desmarcar todo">
                <img src="./ui-icons/list-check.svg" id="icon-select-all" alt="Seleccionar todo">
            </button>
            <button id="btn-download-preset" class="icon-btn" title="Descargar KML">
                <img src="./ui-icons/file-download.svg" alt="Descargar">
            </button>
        </div>
    </header>

    <!-- Input de búsqueda rápida -->
    <div id="quick-search-container" class="quick-search-bar" style="display: none;">
        <input type="text" id="quick-search-input" placeholder="Filtrar por nombre...">
    </div>

    <!-- Pestañas de Categorías Principales -->
    <div class="categories-nav-wrapper">
        <div class="scroll-indicator left"></div>
        <div id="categories-chips-container" class="categories-chips-scroll"></div>
        <div class="scroll-indicator right"></div>
    </div>

    <!-- Contenedor de Elementos -->
    <div id="nodes-container" class="nodes-vertical-scroll"></div>
</div>



    <script src="script.js"></script>
</body>
</html>
