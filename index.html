<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Búsqueda de PDI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- 1. BARRA SUPERIOR ROJA FIJA -->
        <header class="app-header">
            <div class="header-title">Búsqueda de PDI</div>
            <div class="header-actions">
                <!-- Selector de Idioma integrado -->
                <select id="select-lang" class="modern-select" title="Idioma / Language">
                    <option value="es" selected>Español</option>
                    <option value="en">English</option>
                    <option value="de">Deutsch</option>
                    <option value="fr">Français</option>
                    <option value="it">Italiano</option>
                    <option value="nl">Nederlands</option>
                </select>
                <!-- Botón de limpiar / reset -->
                <button id="btn-clear" class="icon-btn" title="Quitar selecciones">✕</button>
                <!-- Botón de acción principal (Buscar) -->
                <button id="btn-search" class="icon-btn accent" title="Buscar">✓</button>
            </div>
        </header>

        <!-- 2. BANNER DE INFORMACIÓN Y PARÁMETROS FIJO -->
        <section class="info-banner">
            <div id="info-coords" class="coords-text">Centro: --</div>
            
            <div class="slider-group">
                <div class="slider-label-row">
                    <label for="search-radius">Radio de búsqueda</label>
                    <span class="slider-value"><strong id="radius-value">25</strong> km</span>
                </div>
                <input type="range" id="search-radius" min="1" max="25" value="20">
                <div id="info-area" class="area-text">Superficie del área: -- km²</div>
            </div>

            <div class="results-row">
                <label for="max-results">Máx. resultados:</label>
                <input type="number" id="max-results" value="3000" class="modern-input">
            </div>
        </section>

        <!-- 3. CABECERA DE CATEGORÍAS CON INTERRUPTOR -->
        <div class="categories-bar">
            <span class="categories-title">Categorías</span>
            <div class="expand-control">
                <span>Expandir nodos</span>
                <label class="toggle-switch">
                    <input type="checkbox" id="toggle-expand-all">
                    <span class="slider-switch"></span>
                </label>
            </div>
        </div>

        <!-- 4. PANEL INFERIOR DE CATEGORÍAS (OCUPA 3/4 DE PANTALLA CON SCROLL) -->
        <main class="categories-scroll-container">
            <div id="category-container"></div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
